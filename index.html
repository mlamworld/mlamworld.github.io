<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Y2K SHOP</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Comic Sans MS", Verdana, sans-serif;
    background: linear-gradient(135deg, #12001f, #2b0a45 50%, #12001f);
    color: #fff;
    min-height: 100vh;
  }

  header {
    text-align: center;
    padding: 40px 20px;
  }

  .logo {
    font-size: 56px;
    font-weight: 900;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #ff5cc8, #00e5ff, #b6ff00, #ff5cc8);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 5s linear infinite;
  }

  @keyframes shine {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  .tagline {
    color: #b6ff00;
    letter-spacing: 3px;
    margin-top: 8px;
    font-size: 14px;
  }

  .grid {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 24px;
  }

  .card {
    background: rgba(255, 255, 255, 0.06);
    border: 2px solid rgba(255, 92, 200, 0.4);
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: 0.3s;
  }

  .card:hover {
    border-color: #ff5cc8;
    box-shadow: 0 0 24px rgba(255, 92, 200, 0.6);
    transform: translateY(-4px);
  }

  .card img {
    width: 100%;
    height: 260px;
    object-fit: cover;
    display: block;
    background: #1c0330;
    cursor: pointer;
  }

  .card-body {
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
  }

  .card-name {
    font-size: 15px;
    font-weight: bold;
    line-height: 1.3;
    cursor: pointer;
  }

  .old-price {
    color: #888;
    text-decoration: line-through;
    font-size: 13px;
  }

  .card-price {
    font-size: 22px;
    font-weight: 900;
    color: #b6ff00;
    margin-top: auto;
  }

  .btn-cart {
    display: block;
    text-align: center;
    text-decoration: none;
    padding: 12px;
    border-radius: 10px;
    font-weight: 900;
    letter-spacing: 1px;
    color: #12001f;
    background: linear-gradient(90deg, #ff5cc8, #a45cff, #00e5ff);
    transition: 0.3s;
  }

  .btn-cart:hover {
    box-shadow: 0 0 20px #ff5cc8;
    transform: scale(1.03);
  }

  footer {
    text-align: center;
    padding: 40px 20px;
    margin-top: 40px;
    border-top: 2px solid rgba(255, 92, 200, 0.4);
    color: rgba(255, 255, 255, 0.7);
    font-size: 14px;
  }

  footer a {
    color: #00e5ff;
    text-decoration: none;
  }

  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>

<header>
  <div class="logo">Y2K SHOP</div>
  <div class="tagline">✧ ОФИЦИАЛЬНЫЙ МАГАЗИН ✧</div>
</header>

<div class="grid" id="grid"></div>

<footer>
  <p>✉ hello@y2kshop.ru &nbsp;·&nbsp; ☎ +7 (999) 123-45-67</p>
  <p style="margin-top: 8px;">© 2026 Y2K SHOP · <a href="https://altcraft.com/ru" target="_blank">altcraft.com/ru</a></p>
</footer>

<script>
const CART_URL = "https://altcraft.com/ru";

const products = [
  {
    name: "Женская мини-юбка Y2K с низкой посадкой, черная",
    price: 2990,
    oldPrice: 3990,
    image: "https://images.unsplash.com/photo-1490481651871-ab68de25d43d",
    url: "https://www.asos.com/hollister/hollister-y2k-low-rise-micro-skort-in-black/prd/210446654"
  },
  {
    name: "Женская мини-юбка Y2K из трикотажа, черная",
    price: 2490,
    oldPrice: 3290,
    image: "https://images.unsplash.com/photo-1485968579580-b6d095142e6e",
    url: "https://www.asos.com/motel/motel-classic-low-rise-jersey-mini-skirt-in-black/prd/205904123"
  },
  {
    name: "Женские брюки-карго Y2K с низкой посадкой",
    price: 3990,
    oldPrice: 4990,
    image: "https://images.unsplash.com/photo-1529139574466-a303027c1d8b",
    url: "https://www.asos.com/tammy-girl/tammy-girl-low-rise-y2k-cargo-trousers-with-utility-pocket-detail/prd/203327429"
  },
  {
    name: "Женский топ Y2K с открытой спиной и декором",
    price: 2190,
    oldPrice: 2990,
    image: "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f",
    url: "https://www.asos.com/edikted/edikted-y2k-halter-crop-top-with-diamante-detail/prd/203883528"
  },
  {
    name: "Женские туфли Y2K Mary Jane на платформе",
    price: 4490,
    oldPrice: 5990,
    image: "https://images.unsplash.com/photo-1543163521-1bf539c55dd2",
    url: "https://www.asos.com/asos-design/asos-design-peso-platform-mary-jane-high-heel-shoes-in-black/prd/208427956"
  }
];

const grid = document.getElementById("grid");

products.forEach(p => {
  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <img src="${p.image}" alt="${p.name}">
    <div class="card-body">
      <div class="card-name">${p.name}</div>
      <div class="old-price">${p.oldPrice.toLocaleString("ru-RU")} ₽</div>
      <div class="card-price">${p.price.toLocaleString("ru-RU")} ₽</div>
      <a class="btn-cart" href="${CART_URL}" target="_blank" rel="noopener">🛒 В КОРЗИНУ</a>
    </div>
  `;

  card.querySelector("img").addEventListener("click", () => window.open(p.url, "_blank"));
  card.querySelector(".card-name").addEventListener("click", () => window.open(p.url, "_blank"));

  grid.appendChild(card);
});
</script>

</body>
</html>
