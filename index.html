<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Y2K SHOP</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Comic Sans MS", Verdana, sans-serif;
    background: linear-gradient(135deg, #12001f, #2b0a45 50%, #12001f);
    color: #fff;
    min-height: 100vh;
  }

  header {
    text-align: center;
    padding: 40px 20px;
  }

  .logo {
    font-size: 56px;
    font-weight: 900;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #ff5cc8, #00e5ff, #b6ff00, #ff5cc8);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 5s linear infinite;
  }

  @keyframes shine {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  .tagline {
    color: #b6ff00;
    letter-spacing: 3px;
    margin-top: 8px;
    font-size: 14px;
  }

  .grid {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 24px;
  }

  .card {
    background: rgba(255, 255, 255, 0.06);
    border: 2px solid rgba(255, 92, 200, 0.4);
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: 0.3s;
  }

  .card:hover {
    border-color: #ff5cc8;
    box-shadow: 0 0 24px rgba(255, 92, 200, 0.6);
    transform: translateY(-4px);
  }

  .card img {
    width: 100%;
    height: 260px;
    object-fit: cover;
    display: block;
    background: #1c0330;
  }

  .card-body {
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
  }

  .card-name {
    font-size: 15px;
    font-weight: bold;
    line-height: 1.3;
  }

  .card-price {
    font-size: 22px;
    font-weight: 900;
    color: #b6ff00;
    margin-top: auto;
  }

  .btn-cart {
    display: block;
    text-align: center;
    text-decoration: none;
    padding: 12px;
    border-radius: 10px;
    font-weight: 900;
    letter-spacing: 1px;
    color: #12001f;
    background: linear-gradient(90deg, #ff5cc8, #a45cff, #00e5ff);
    transition: 0.3s;
  }

  .btn-cart:hover {
    box-shadow: 0 0 20px #ff5cc8;
    transform: scale(1.03);
  }

  footer {
    text-align: center;
    padding: 40px 20px;
    margin-top: 40px;
    border-top: 2px solid rgba(255, 92, 200, 0.4);
    color: rgba(255, 255, 255, 0.7);
    font-size: 14px;
  }

  footer a {
    color: #00e5ff;
    text-decoration: none;
  }

  footer a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

<header>
  <div class="logo">Y2K SHOP</div>
  <div class="tagline">✧ ОФИЦИАЛЬНЫЙ МАГАЗИН ✧</div>
</header>

<div class="grid" id="grid"></div>

<footer>
  <p>✉ hello@y2kshop.ru &nbsp;·&nbsp; ☎ +7 (999) 123-45-67</p>
  <p style="margin-top: 8px;">© 2026 Y2K SHOP · <a href="https://altcraft.com/ru" target="_blank">altcraft.com/ru</a></p>
</footer>

<script>
  // ============================================
  // ТОВАРЫ ИЗ ФИДА — вшиты напрямую
  // ============================================
  const CART_URL = "https://altcraft.com/ru";

  const products = [
    {
      name: "Юбка мини Y2K",
      price: 2990,
      image: "https://img-edg.joomcdn.net/a6f1c3f2bc334503ef96c5dfe97fc684400d7574_original.jpeg",
      url: "https://www.joom.ru/ru/products/666960bc477400015916813b"
    },
    {
      name: "Женские брюки карго Y2K",
      price: 3490,
      image: "https://img-edg.joomcdn.net/9a339a782358ffd917203f1e0004030708beda77_original.jpeg",
      url: "https://www.joom.ru/ru/products/6461d92f4636ab01307ad515"
    },
    {
      name: "Женский топ Y2K",
      price: 1990,
      image: "https://img-edg.joomcdn.net/2d3ee793d7819192af3805714fecac4c29ad85ef_original.jpeg",
      url: "https://www.joom.ru/ru/products/64f04801324349013af0a2f5"
    },
    {
      name: "Женские туфли на платформе Y2K",
      price: 3990,
      image: "https://img-edg.joomcdn.net/9e0868b2de37001bfa1ae6c558a135c2215d5a71_original.jpeg",
      url: "https://www.joom.ru/ru/products/65d71a782399f201227a423d"
    }
  ];

  // ============================================
  // ОТРИСОВКА
  // ============================================
  const grid = document.getElementById("grid");

  products.forEach(p => {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <img src="${p.image}" alt="${p.name}" onerror="this.style.background='#1c0330'">
      <div class="card-body">
        <div class="card-name">${p.name}</div>
        <div class="card-price">${p.price.toLocaleString("ru-RU")} ₽</div>
        <a class="btn-cart" href="${CART_URL}" target="_blank" rel="noopener">🛒 В КОРЗИНУ</a>
      </div>
    `;

    // Клик по картинке → страница товара
    card.querySelector("img").style.cursor = "pointer";
    card.querySelector("img").addEventListener("click", () => {
      window.open(p.url, "_blank", "noopener");
    });

    grid.appendChild(card);
  });
</script>

</body>
</html>
